version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: questionnaire-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: questionnaire123
      MYSQL_DATABASE: questionnaire_db
      MYSQL_USER: questionnaire
      MYSQL_PASSWORD: questionnaire123
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql-data:
    driver: local
