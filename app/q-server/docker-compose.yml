services:
  postgres:
    image: postgres:16-alpine
    container_name: questionnaire-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: questionnaire
      POSTGRES_PASSWORD: questionnaire123
      POSTGRES_DB: questionnaire_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questionnaire -d questionnaire_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: questionnaire-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: questionnaire-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: questionnaire
      RABBITMQ_DEFAULT_PASS: questionnaire123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: questionnaire-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: questionnaire
      MINIO_ROOT_PASSWORD: questionnaire123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: questionnaire-clickhouse
    ports:
      - "8123:8123"     # HTTP 接口（@clickhouse/client 使用）
      - "9010:9000"     # Native TCP 接口（避开 MinIO 的 9000）
      - "9009:9009"     # 集群间通信（预留）
    environment:
      CLICKHOUSE_USER: questionnaire
      CLICKHOUSE_PASSWORD: questionnaire123
      CLICKHOUSE_DB: questionnaire_tracking
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      # 容器首次启动时自动执行建表脚本，避免手动执行导致的表缺失问题
      - ./sql/clickhouse-tracking-schema.sql:/docker-entrypoint-initdb.d/01-tracking-schema.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "questionnaire", "--password", "questionnaire123", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: questionnaire-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: questionnaire_logs
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
  mongo-data:
    driver: local
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local
