services:
  postgres:
    image: postgres:16-alpine
    container_name: questionnaire-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: questionnaire
      POSTGRES_PASSWORD: questionnaire123
      POSTGRES_DB: questionnaire_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questionnaire -d questionnaire_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PgBouncer 连接池 — 减少 PostgreSQL 连接数，复用连接
  # 生产环境 Prisma 连接 PgBouncer 而非直连 PG
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: questionnaire-pgbouncer
    ports:
      - "6432:6432"
    environment:
      PGBOUNCER_DATABASE: questionnaire_db
      PGBOUNCER_PORT: 6432
      PGBOUNCER_MAX_CLIENT_CONN: "500"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_AUTH_TYPE: plain
      PGBOUNCER_AUTH_USER: questionnaire
      PGBOUNCER_AUTH_PASSWORD: questionnaire123
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: questionnaire
      POSTGRESQL_PASSWORD: questionnaire123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "questionnaire", "-d", "questionnaire_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: questionnaire-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: questionnaire-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: questionnaire
      RABBITMQ_DEFAULT_PASS: questionnaire123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: questionnaire-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: questionnaire
      MINIO_ROOT_PASSWORD: questionnaire123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: questionnaire-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: questionnaire_logs
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
  mongo-data:
    driver: local
