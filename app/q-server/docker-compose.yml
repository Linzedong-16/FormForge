version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: questionnaire-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: questionnaire
      POSTGRES_PASSWORD: questionnaire123
      POSTGRES_DB: questionnaire_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questionnaire -d questionnaire_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: questionnaire-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: questionnaire-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI — http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: questionnaire
      RABBITMQ_DEFAULT_PASS: questionnaire123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: questionnaire-minio
    ports:
      - "9000:9000"   # S3 兼容 API
      - "9001:9001"   # 管理控制台 — http://localhost:9001
    environment:
      MINIO_ROOT_USER: questionnaire
      MINIO_ROOT_PASSWORD: questionnaire123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
